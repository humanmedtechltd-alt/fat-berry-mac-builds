name: Private-source Mac installers on free standard runners
run-name: "${{ github.workflow }} | ${{ inputs.index_sha256 }} | ${{ inputs.products || inputs.platform || '' }}"

on:
  workflow_dispatch:
    inputs:
      products:
        description: JSON array of product slugs from the private batch index
        required: true
        type: string
      index_sha256:
        description: SHA-256 of the immutable private input index
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fatberry-macos-release-${{ github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        slug: ${{ fromJSON(inputs.products) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Set up restricted private batch transfer
        env:
          RUNNER_SSH_KEY: ${{ secrets.RUNNER_SSH_KEY }}
          RUNNER_KNOWN_HOSTS: ${{ secrets.RUNNER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RUNNER_SSH_KEY" > "$HOME/.ssh/fatberry-build"
          printf '%s\n' "$RUNNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Build and validate private source without exposing compiler logs
        env:
          PRODUCT_SLUG: ${{ matrix.slug }}
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          INPUT_INDEX_SHA256: ${{ inputs.index_sha256 }}
          FATBERRY_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: python3 scripts/build_product.py "$PRODUCT_SLUG"
      - name: Save private diagnostics even after interruption
        if: always()
        env:
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
        run: python3 scripts/finalize_job.py
      - name: Remove private checkout and SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/fatberry-build"
          rm -rf work
  continue-independent-pilots:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure private one-shot queue access
        env:
          RUNNER_SSH_KEY: ${{ secrets.RUNNER_SSH_KEY }}
          RUNNER_KNOWN_HOSTS: ${{ secrets.RUNNER_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RUNNER_SSH_KEY" > "$HOME/.ssh/fatberry-build"
          printf '%s\n' "$RUNNER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Dispatch the explicitly queued independent source pilot
        env:
          INPUT_INDEX_SHA256: ${{ inputs.index_sha256 }}
          CONTINUATION_KIND: build
          RUNNER_SSH_HOST: ${{ secrets.RUNNER_SSH_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch_activation_continuation.py
      - name: Remove queue credentials
        if: always()
        run: rm -f "$HOME/.ssh/fatberry-build"
